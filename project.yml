name: MyFit
options:
  bundleIdPrefix: com.sergiogonzalez
  createIntermediateGroups: true
targets:
  MyFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyFit
      - path: MyFit/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiogonzalez.myfit
        PRODUCT_NAME: MyFit
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_KEY_CFBundleDisplayName: MyFit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "MyFit necesita acceso a la cámara para fotografiar tus comidas y estimar sus calorías."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "MyFit necesita acceso a tu galería para elegir fotos de tus comidas."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "MyFit necesita acceder a tus entrenamientos de Apple Salud para importarlos."
        CODE_SIGN_ENTITLEMENTS: MyFit/MyFit.entitlements
