name: MyFit
options:
  bundleIdPrefix: com.sergiogonzalez
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: B68X598V6J
targets:
  MyFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyFit
      - path: MyFit/Assets.xcassets
      - path: MyFit/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiogonzalez.myfit
        PRODUCT_NAME: MyFitOct
        # El módulo de Swift se queda como "MyFit" a propósito, desacoplado de
        # PRODUCT_NAME: si no se fija, PRODUCT_MODULE_NAME hereda el nombre del
        # producto y rompe "@testable import MyFit" en todos los tests.
        PRODUCT_MODULE_NAME: MyFit
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_KEY_CFBundleDisplayName: MyFit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "MyFit necesita acceso a la cámara para fotografiar tus comidas y estimar sus calorías."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "MyFit necesita acceso a tu galería para elegir fotos de tus comidas."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "MyFit necesita acceder a tus entrenamientos de Apple Salud para importarlos."
        CODE_SIGN_ENTITLEMENTS: MyFit/MyFit.entitlements
  MyFitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyFitTests
    dependencies:
      - target: MyFit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiogonzalez.myfit.tests
        # XcodeGen deriva TEST_HOST del nombre del target (MyFit), pero el producto
        # se compila como MyFitOct.app (PRODUCT_NAME), así que hay que fijar la ruta
        # del host a mano o el test bundle no encuentra el ejecutable a testear.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyFitOct.app/MyFitOct"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MyFit:
    build:
      targets:
        MyFit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MyFitTests
